
[project]
name = "incar_baselines"
version = "1.0.6"
readme = "README.md"
authors = [
    { name = "Jonne van Haastregt", email = "jonne.vanhaastregt@incar-robotics.se" },
]
license = "LicenseRef-INCAR-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "diffusers",
    "einops"
]

[project.optional-dependencies]
s2 = [
    "depth_anything_3@git+https://github.com/ByteDance-Seed/Depth-Anything-3",
    "sam2",
    "opencv-python",
    "transformers"
]
gr00t = [
    "zmq",
    "msgpack",
    "msgpack_numpy",
    "jsonlines",
    "pyarrow"
]

[tool.setuptools.packages.find]
include = ["incar_baselines_ai", "s2_processing", "gr00t*", "dataset_conversions"]

[project.entry-points.'incar_extensions.processing']
s2_processing = 's2_processing'
conversions = 'dataset_conversions'

[project.entry-points.'incar_extensions.ai']
incar_baselines_ai = 'incar_baselines_ai'
gr00t = 'gr00t'
